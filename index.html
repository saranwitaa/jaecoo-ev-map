<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Finder + Map - JAECOO 5 Max+</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        .custom-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            color: white;
            font-size: 12px;
        }
        .pin-green { background-color: #10b981; }
        .pin-red { background-color: #ef4444; }
        .pin-user { background-color: #3b82f6; border-width: 3px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-10">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2 text-emerald-400">
                    <i class="fa-solid fa-map-location-dot"></i> EV Map Finder
                </h1>
                <p class="text-xs text-slate-400">แผนที่จุดชาร์จ Real-time สำหรับ JAECOO 5 Max+</p>
            </div>
            <button onclick="getUserLocation()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg transition flex items-center gap-1 shadow">
                <i class="fa-solid fa-location-crosshairs"></i> อัปเดต GPS
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-4">

        <!-- Notification Banner -->
        <div id="status-banner" class="hidden p-3 rounded-xl text-xs flex items-start gap-2 border"></div>

        <!-- User Location & Radius Box -->
        <section class="bg-slate-800 p-4 rounded-xl shadow border border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
            <div>
                <span class="text-xs text-slate-400 block mb-1">พิกัดปัจจุบันของป๋า:</span>
                <div id="user-coords" class="font-mono text-sm text-emerald-400 font-semibold">
                    <i class="fa-solid fa-spinner animate-spin"></i> กำลังระบุพิกัด GPS...
                </div>
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto">
                <label class="text-xs text-slate-400 whitespace-nowrap">รัศมีค้นหา:</label>
                <select id="radius-select" onchange="fetchRealtimeStations()" class="bg-slate-700 text-slate-100 text-xs px-2.5 py-2 rounded-lg border border-slate-600 focus:outline-none">
                    <option value="15">15 กม.</option>
                    <option value="30" selected>30 กม.</option>
                    <option value="50">50 กม.</option>
                    <option value="100">100 กม.</option>
                </select>
            </div>
        </section>

        <!-- MAP CONTAINER -->
        <section class="bg-slate-800 p-2 rounded-xl border border-slate-700 shadow-lg">
            <div id="map" class="h-72 sm:h-96 w-full rounded-lg z-10"></div>
        </section>

        <!-- Legend & Filters -->
        <section class="flex flex-wrap gap-2 items-center justify-between text-xs">
            <div class="flex gap-1.5 bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button onclick="setFilter('all')" id="btn-all" class="px-3 py-1.5 rounded-md font-medium transition bg-slate-700 text-white">ทั้งหมด</button>
                <button onclick="setFilter('supported')" id="btn-supported" class="px-3 py-1.5 rounded-md font-medium transition text-emerald-400 hover:bg-slate-700">🟢 รองรับเท่านั้น</button>
                <button onclick="setFilter('unsupported')" id="btn-unsupported" class="px-3 py-1.5 rounded-md font-medium transition text-red-400 hover:bg-slate-700">🔴 ไม่รองรับเท่านั้น</button>
            </div>
            <span id="station-count" class="text-slate-400">กำลังโหลด...</span>
        </section>

        <!-- Station List Container -->
        <div id="station-list" class="space-y-3"></div>

    </main>

    <script>
        let currentLat = 14.473119;
        let currentLng = 100.125103;
        let fetchedStations = [];
        let activeFilter = 'all';

        let map;
        let markersGroup;
        let userMarker;

        const OCM_API_KEY = "188a1b5d-2490-482a-89a3-5a02e6e30018";

        const greenIcon = L.divIcon({
            className: 'custom-pin-wrap',
            html: `<div class="custom-pin pin-green" style="width:30px; height:30px;"><i class="fa-solid fa-bolt"></i></div>`,
            iconSize: [30, 30], iconAnchor: [15, 15]
        });

        const redIcon = L.divIcon({
            className: 'custom-pin-wrap',
            html: `<div class="custom-pin pin-red" style="width:30px; height:30px;"><i class="fa-solid fa-xmark"></i></div>`,
            iconSize: [30, 30], iconAnchor: [15, 15]
        });

        const userIcon = L.divIcon({
            className: 'custom-pin-wrap',
            html: `<div class="custom-pin pin-user" style="width:34px; height:34px;"><i class="fa-solid fa-user-large"></i></div>`,
            iconSize: [34, 34], iconAnchor: [17, 17]
        });

        function initMap() {
            map = L.map('map').setView([currentLat, currentLng], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function getUserLocation() {
            const coordsElement = document.getElementById('user-coords');
            coordsElement.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> กำลังระบุพิกัด GPS...`;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        coordsElement.innerHTML = `<i class="fa-solid fa-location-dot text-emerald-400"></i> Lat: ${currentLat.toFixed(6)}, Long: ${currentLng.toFixed(6)}`;
                        fetchRealtimeStations();
                    },
                    (error) => {
                        coordsElement.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> ใช้พิกัดสุพรรณบุรี (อ้างอิง)`;
                        fetchRealtimeStations();
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                coordsElement.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-500"></i> ไม่รองรับ GPS`;
                fetchRealtimeStations();
            }
        }

        // ข้อมูลสำรองจำลองสถานีในไทย
        function getMockStations() {
            return [
                { name: "PEA VOLTA ปั๊มบางกรรจ์ สุพรรณบุรี", app: "PEA Volta", lat: 14.4750, lng: 100.1200, plugs: ["CCS2 (120kW)", "Type 2 (22kW)"], isSupported: true, address: "อ.เมืองสุพรรณบุรี" },
                { name: "PTT EV Station PluZ หลักเมืองสุพรรณบุรี", app: "EV Station PluZ", lat: 14.4820, lng: 100.1180, plugs: ["CCS2 (160kW)", "Type 2"], isSupported: true, address: "ถ.มาลัยแมน สุพรรณบุรี" },
                { name: "EleXA by EGAT ปั๊ม PT บางบัวทอง", app: "EleXA", lat: 13.9180, lng: 100.3950, plugs: ["CCS2 (120kW)", "Type 2"], isSupported: true, address: "บางบัวทอง นนทบุรี" },
                { name: "Evolt Station โรบินสัน สุพรรณบุรี", app: "Evolt", lat: 14.4550, lng: 100.1350, plugs: ["CCS2 (50kW)", "Type 2"], isSupported: true, address: "ห้างโรบินสัน สุพรรณบุรี" },
                { name: "Tesla Supercharger Central Westgate", app: "Tesla App", lat: 13.8760, lng: 100.4110, plugs: ["Tesla Supercharger (NACS/Proprietary)"], isSupported: false, address: "เซ็นทรัล เวสต์เกต" },
                { name: "EA Anywhere - สถานีชาร์จเก่า (GB/T Only)", app: "EA Anywhere", lat: 14.4900, lng: 100.1100, plugs: ["CHAdeMO", "GB/T"], isSupported: false, address: "อ.เมืองสุพรรณบุรี" }
            ].map(st => ({
                ...st,
                distance: calculateDistance(currentLat, currentLng, st.lat, st.lng)
            }));
        }

        function showBanner(type, msg) {
            const banner = document.getElementById('status-banner');
            banner.classList.remove('hidden', 'bg-emerald-950', 'border-emerald-800', 'text-emerald-300', 'bg-amber-950', 'border-amber-800', 'text-amber-300');
            
            if (type === 'success') {
                banner.classList.add('bg-emerald-950', 'border-emerald-800', 'text-emerald-300');
            } else {
                banner.classList.add('bg-amber-950', 'border-amber-800', 'text-amber-300');
            }
            banner.innerHTML = msg;
        }

        async function fetchRealtimeStations() {
            const container = document.getElementById('station-list');
            const radius = document.getElementById('radius-select').value;
            document.getElementById('station-count').innerText = "กำลังดึงข้อมูล...";

            container.innerHTML = `
                <div class="bg-slate-800 p-6 rounded-xl text-center text-slate-400 border border-slate-700">
                    <i class="fa-solid fa-circle-notch animate-spin text-3xl text-emerald-400 mb-2"></i>
                    <p class="text-sm">กำลังเชื่อมต่อ API สด ค้นหารัศมี ${radius} กม. ...</p>
                </div>`;

            const url = `https://api.openchargemap.io/v3/poi/?output=json&latitude=${currentLat}&longitude=${currentLng}&distance=${radius}&distanceunit=KM&maxresults=40&compact=true&verbose=false&key=${OCM_API_KEY}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP Error Status: ${response.status}`);
                
                const data = await response.json();

                if(!Array.isArray(data) || data.length === 0) {
                    throw new Error("No data returned from API");
                }

                fetchedStations = data.map(item => {
                    const lat = item.AddressInfo ? item.AddressInfo.Latitude : 0;
                    const lng = item.AddressInfo ? item.AddressInfo.Longitude : 0;
                    const name = item.AddressInfo ? (item.AddressInfo.Title || "สถานีชาร์จ EV") : "สถานีชาร์จ EV";
                    const app = item.OperatorInfo ? (item.OperatorInfo.Title || "ไม่ระบุแอป") : "ไม่ระบุแอป";
                    
                    let plugs = [];
                    let isSupported = false;

                    if (item.Connections && item.Connections.length > 0) {
                        item.Connections.forEach(conn => {
                            const connTitle = conn.ConnectionType ? conn.ConnectionType.Title : "";
                            const connId = conn.ConnectionTypeID;

                            if (connId === 33 || connId === 25 || connTitle.includes("CCS") || connTitle.includes("Type 2")) {
                                isSupported = true;
                                plugs.push(connTitle || "CCS2 / Type 2");
                            } else {
                                plugs.push(connTitle || "หัวชาร์จอื่นๆ");
                            }
                        });
                    } else {
                        plugs.push("CCS2 / Type 2");
                        isSupported = true;
                    }

                    return {
                        name: name,
                        app: app,
                        lat: lat,
                        lng: lng,
                        plugs: Array.from(new Set(plugs)),
                        isSupported: isSupported,
                        distance: calculateDistance(currentLat, currentLng, lat, lng),
                        address: item.AddressInfo ? (item.AddressInfo.AddressLine1 || "") : ""
                    };
                });

                showBanner('success', `<i class="fa-solid fa-circle-check text-emerald-400 mt-0.5"></i> <span><b>เชื่อมต่อ API สดสำเร็จ:</b> แสดงข้อมูลสถานีชาร์จจริงจาก OpenChargeMap</span>`);

            } catch (err) {
                console.warn("API Fetch failed, using fallback mock data:", err);
                // สลับไปใช้ข้อมูลสำรองโดยอัตโนมัติ
                fetchedStations = getMockStations();
                showBanner('warning', `<i class="fa-solid fa-triangle-exclamation text-amber-400 mt-0.5"></i> <span><b>เปิดใช้งาน Fallback Mode:</b> ไม่สามารถดึงข้อมูล API สดได้ (ติดปัญหา CORS/เปิดจากไฟล์ในเครื่อง) ระบบจึงแสดงข้อมูลสถานีสำรองเพื่อให้ป๋าทดสอบแผนที่และหมุดปักได้ราบรื่นค่ะ</span>`);
            }

            fetchedStations.sort((a, b) => a.distance - b.distance);
            renderStations();
        }

        function setFilter(filterType) {
            activeFilter = filterType;
            document.querySelectorAll('#btn-all, #btn-supported, #btn-unsupported').forEach(btn => {
                btn.className = "px-3 py-1.5 rounded-md font-medium transition hover:bg-slate-700 text-slate-400";
            });

            if(filterType === 'all') document.getElementById('btn-all').className = "px-3 py-1.5 rounded-md font-medium bg-slate-700 text-white";
            else if(filterType === 'supported') document.getElementById('btn-supported').className = "px-3 py-1.5 rounded-md font-medium bg-emerald-950 text-emerald-400 border border-emerald-800";
            else if(filterType === 'unsupported') document.getElementById('btn-unsupported').className = "px-3 py-1.5 rounded-md font-medium bg-red-950 text-red-400 border border-red-800";

            renderStations();
        }

        function renderStations() {
            const container = document.getElementById('station-list');
            let displayList = [...fetchedStations];

            if (activeFilter === 'supported') displayList = displayList.filter(st => st.isSupported);
            else if (activeFilter === 'unsupported') displayList = displayList.filter(st => !st.isSupported);

            document.getElementById('station-count').innerText = `พบทั้งหมด ${displayList.length} สถานี`;

            updateMapMarkers(displayList);

            if (displayList.length === 0) {
                container.innerHTML = `<div class="bg-slate-800 p-8 rounded-xl text-center text-slate-400 border border-slate-700"><p>ไม่พบสถานีชาร์จตามเงื่อนไข</p></div>`;
                return;
            }

            let html = '';
            displayList.forEach((station) => {
                const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${station.lat},${station.lng}`;
                const cardBorderClass = station.isSupported ? 'border-emerald-500/80' : 'border-red-500/80';
                const badgeClass = station.isSupported ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' : 'bg-red-500/20 text-red-400 border-red-500/40';
                const badgeIcon = station.isSupported ? '<i class="fa-solid fa-circle-check"></i> รองรับ JAECOO 5 Max+' : '<i class="fa-solid fa-circle-xmark"></i> ไม่รองรับ JAECOO 5 Max+';
                const distColorClass = station.isSupported ? 'text-emerald-400' : 'text-red-400';

                html += `
                <div class="bg-slate-800 rounded-xl p-4 border ${cardBorderClass} shadow-md hover:shadow-lg transition">
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <div>
                            <span class="inline-flex items-center gap-1.5 text-[11px] font-bold px-2.5 py-1 rounded-full border ${badgeClass} mb-1.5">
                                ${badgeIcon}
                            </span>
                            <h3 class="font-bold text-slate-100 text-base">${station.name}</h3>
                            ${station.address ? `<p class="text-xs text-slate-400 mt-0.5">${station.address}</p>` : ''}
                        </div>
                        <div class="text-right flex-shrink-0">
                            <span class="text-lg font-bold ${distColorClass}">${station.distance.toFixed(2)}</span>
                            <span class="text-xs text-slate-400"> กม.</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs my-3 bg-slate-900/70 p-3 rounded-lg border border-slate-700/60">
                        <div>
                            <span class="text-slate-400 block mb-0.5">Application:</span> 
                            <span class="font-semibold text-yellow-400"><i class="fa-solid fa-mobile-screen-button"></i> ${station.app}</span>
                        </div>
                        <div>
                            <span class="text-slate-400 block mb-0.5">พิกัด (Lat, Long):</span> 
                            <span class="font-mono text-slate-300"><i class="fa-solid fa-map-pin"></i> ${station.lat.toFixed(6)}, ${station.lng.toFixed(6)}</span>
                        </div>
                        <div class="col-span-1 md:col-span-2">
                            <span class="text-slate-400 block mb-0.5">หัวชาร์จ:</span> 
                            <span class="font-medium ${station.isSupported ? 'text-emerald-300' : 'text-red-300'}">${station.plugs.join(', ')}</span>
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-1">
                        <button onclick="focusOnMap(${station.lat}, ${station.lng})" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1 border border-slate-600">
                            <i class="fa-solid fa-map-pin text-amber-400"></i> ดูบนแผนที่
                        </button>
                        <a href="${navUrl}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3.5 py-2 rounded-lg font-medium transition flex items-center gap-1.5 shadow">
                            <i class="fa-solid fa-location-arrow"></i> นำทาง Google Maps
                        </a>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function updateMapMarkers(stations) {
            markersGroup.clearLayers();

            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.marker([currentLat, currentLng], { icon: userIcon })
                .bindPopup(`<b style="color:#1e293b">📍 ตำแหน่งของป๋า</b>`)
                .addTo(map);

            let boundsList = [[currentLat, currentLng]];

            stations.forEach(st => {
                const icon = st.isSupported ? greenIcon : redIcon;
                const popupContent = `
                    <div style="color:#0f172a; font-family:sans-serif; min-width:160px;">
                        <b style="font-size:13px; display:block; margin-bottom:4px;">${st.name}</b>
                        <p style="margin:2px 0; font-size:11px;"><b>App:</b> ${st.app}</p>
                        <p style="margin:2px 0; font-size:11px;"><b>ระยะทาง:</b> ${st.distance.toFixed(2)} กม.</p>
                        <p style="margin:2px 0; font-size:10px; color:#64748b; font-family:monospace;">${st.lat.toFixed(5)}, ${st.lng.toFixed(5)}</p>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${st.lat},${st.lng}" target="_blank" 
                           style="display:inline-block; margin-top:6px; background:#059669; color:white; padding:4px 8px; border-radius:4px; text-decoration:none; font-size:11px;">
                           🧭 นำทาง
                        </a>
                    </div>
                `;

                const marker = L.marker([st.lat, st.lng], { icon: icon }).bindPopup(popupContent);
                markersGroup.addLayer(marker);
                boundsList.push([st.lat, st.lng]);
            });

            if (boundsList.length > 1) {
                map.fitBounds(boundsList, { padding: [30, 30] });
            } else {
                map.setView([currentLat, currentLng], 12);
            }
        }

        function focusOnMap(lat, lng) {
            window.scrollTo({ top: 120, behavior: 'smooth' });
            map.setView([lat, lng], 15);
            markersGroup.eachLayer(layer => {
                if (layer.getLatLng().lat === lat && layer.getLatLng().lng === lng) {
                    layer.openPopup();
                }
            });
        }

        window.onload = () => {
            initMap();
            getUserLocation();
        };
    </script>
</body>
</html>
